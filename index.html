<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e2b57a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>わくわくキッチン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23e2b57a' width='16' height='16'/%3E%3Crect fill='%23f0c43c' x='2' y='6' width='12' height='7' rx='3'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app" class="is-overlay">
      <div id="stage">
        <canvas id="game" width="160" height="144"></canvas>
      </div>
      <aside id="hud">
        <div class="hud-card">
          <div class="hud-top">
            <h1 id="dish-title">マヨオムレツ</h1>
            <p id="step-label">てじゅん 1 / 7</p>
          </div>
          <p id="step-list"></p>
          <p id="instruction">よみこみちゅう…</p>
          <p id="hint"></p>
          <div id="progress-wrap"><div id="progress-bar"></div></div>
          <p id="feedback"></p>
        </div>
      </aside>

      <div id="title-screen" class="overlay">
        <div class="overlay-card">
          <h1>わくわくキッチン</h1>
          <p id="title-dish" class="sub">きょうの おかず</p>
          <p class="pulse">タップしてスタート</p>
        </div>
      </div>

      <div id="complete-screen" class="overlay" hidden>
        <div class="overlay-card">
          <h1>できあがり！</h1>
          <p id="complete-message" class="sub">できたてホカホカの マヨオムレツです！</p>
          <div class="btn-row">
            <button id="retry" type="button">もういちど</button>
            <button id="to-title" class="secondary" type="button">タイトルへ</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
